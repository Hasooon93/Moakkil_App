<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B132B">
    <meta name="description" content="بوابة التحقق الرسمية المعتمدة لنظام موكّل لإدارة المحاماة - التحقق الفوري من صحة السندات المالية والهويات المهنية">
    <title>التحقق من صحة السجلات | نظام موكّل V5.6</title>
    
    <!-- PWA Integration -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    
    <!-- Fonts & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           [1] المتغيرات اللونية وهوية V5.6 الملكية (Tokens & Themes)
           ========================================================================== */
        :root {
            /* V5.6 Brand Tokens */
            --primary-navy: #0B132B;
            --secondary-navy: #1C2541;
            --royal-gold: #D4AF37;
            --dark-gold: #8A6A12;
            --emerald: #1F7A5C;
            --emerald-bg: rgba(31, 122, 92, 0.12);
            --ruby: #B3372F;
            --ruby-bg: rgba(179, 55, 47, 0.12);
            
            /* Light Theme Defaults */
            --bg-color: #FAF8F3;
            --card-bg: #FFFFFF;
            --text-main: #0B132B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --data-row-bg: #F8FAFC;
            --seal-border: rgba(212, 175, 55, 0.35);
            --body-gradient: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FAF8F3 100%);
        }

        [data-theme="dark"] {
            /* WCAG AAA High-Contrast Dark Theme */
            --bg-color: #070C1B;
            --card-bg: #111A33;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #1E293B;
            --data-row-bg: #0C1427;
            --seal-border: rgba(212, 175, 55, 0.45);
            --body-gradient: radial-gradient(circle at 50% 0%, #111A33 0%, #070C1B 100%);
        }

        /* ==========================================================================
           [2] الهيكل العام والتجاوب (Layout & Global Styles)
           ========================================================================== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Cairo', system-ui, -apple-system, sans-serif; 
            background: var(--body-gradient);
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100dvh; 
            padding: 24px 16px; 
            margin: 0;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ==========================================================================
           [3] بطاقة التحقق الملكية المدمجة (V5.6 Verification Card)
           ========================================================================== */
        .verify-card { 
            background: var(--card-bg); 
            border-radius: 28px; 
            box-shadow: 0 20px 45px rgba(11, 19, 43, 0.08); 
            width: 100%; 
            max-width: 460px; 
            padding: 36px 28px; 
            border: 1px solid var(--border-color);
            border-top: 6px solid var(--emerald); 
            text-align: center; 
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .verify-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--emerald) 0%, var(--royal-gold) 100%);
            opacity: 0.9;
        }
        
        .verify-card.status-invalid-card { 
            border-top-color: var(--ruby); 
        }

        .verify-card.status-invalid-card::before {
            background: var(--ruby);
        }

        h3, h4 { color: var(--text-main) !important; letter-spacing: -0.3px; }
        .text-navy { color: var(--primary-navy) !important; }
        [data-theme="dark"] .text-navy { color: #38BDF8 !important; }
        .text-muted { color: var(--text-muted) !important; }
        .text-gold { color: var(--royal-gold) !important; }

        /* ==========================================================================
           [4] أختام التحقق والأيقونات (Verification Seals & Icons)
           ========================================================================== */
        .status-icon { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 24px auto; 
            font-size: 42px; 
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .status-icon::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px dashed currentColor;
            opacity: 0.35;
        }
        
        .status-valid { 
            background-color: var(--emerald-bg); 
            color: var(--emerald); 
        }

        .status-invalid { 
            background-color: var(--ruby-bg); 
            color: var(--ruby); 
        }
        
        /* الصورة الشخصية وشعار الهوية (vCard Avatar) */
        .vcard-avatar {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 50%;
            margin: 0 auto 22px auto;
            border: 4px solid var(--card-bg);
            box-shadow: 0 12px 28px rgba(11, 19, 43, 0.12);
            background: linear-gradient(135deg, var(--primary-navy) 0%, var(--secondary-navy) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--royal-gold);
            font-size: 2.6rem;
            font-weight: 800;
            position: relative;
        }

        .vcard-avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        .verified-badge-pill {
            position: absolute;
            bottom: 18px;
            right: 0;
            background: var(--emerald);
            color: #FFFFFF;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 3px solid var(--card-bg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* ==========================================================================
           [5] أسطر عرض البيانات المشفرة (Data Rows & Fields)
           ========================================================================== */
        .data-container {
            text-align: right;
            background-color: var(--data-row-bg);
            padding: 22px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .data-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 12px 0; 
            border-bottom: 1px dashed var(--border-color); 
            font-size: 0.95rem;
        }
        
        .data-row:last-child { 
            border-bottom: none; 
            padding-bottom: 0; 
        }

        .data-row span.label-text { 
            color: var(--text-muted); 
            font-weight: 600; 
            font-size: 0.9rem;
        }
        
        /* زر تصدير بطاقة المحامي (vCard Button) */
        .btn-vcard {
            background: linear-gradient(135deg, var(--primary-navy) 0%, var(--secondary-navy) 100%);
            color: #FFFFFF;
            border: 1px solid rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .btn-vcard:hover, .btn-vcard:focus {
            opacity: 0.94;
            color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(11, 19, 43, 0.2);
            border-color: var(--royal-gold);
        }

        /* الرسوم المتحركة الناعمة */
        .fade-in { 
            animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(12px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body>

    <div id="verify-content" class="verify-card fade-in">
        
        <!-- حالة التحميل الأولية (Loading State) -->
        <div id="loading-state">
            <div class="spinner-border mb-4" role="status" style="width: 3.5rem; height: 3.5rem; border-width: 0.25em; color: var(--royal-gold);"></div>
            <h4 class="fw-bold">جاري التحقق من السجلات...</h4>
            <p class="text-muted small px-3 mt-2">يرجى الانتظار بينما تتم مطابقة البيانات التشفيرية مع السحابة المركزية الموثقة لنظام موكّل.</p>
        </div>

        <!-- حالة النتيجة المعتمدة (Result State) -->
        <div id="result-state" class="d-none fade-in">
            <div id="header-visual-element"></div>
            
            <h3 id="status-title" class="fw-bold mb-1">نتيجة التحقق</h3>
            <p id="status-desc" class="text-muted small mb-4">تفاصيل السجل المعتمدة والمستخرجة من النظام</p>
            
            <div id="data-container" class="data-container shadow-sm">
                <!-- يتم حقن البيانات ديناميكياً -->
            </div>

            <!-- الختم السفلي للمنصة -->
            <div class="mt-4 pt-4 border-top" style="border-color: var(--border-color) !important;">
                <div class="d-flex align-items-center justify-content-center gap-2 mb-1">
                    <img src="./icons/icon-192.png" width="28" height="28" class="rounded-circle shadow-sm" alt="شعار موكّل" onerror="this.style.display='none'">
                    <span class="fw-bold" style="color: var(--royal-gold); font-size: 0.95rem;">نظام موكّل لإدارة المحاماة</span>
                </div>
                <p class="small text-muted mb-0" style="font-size: 0.78rem;">بوابة التحقق السحابية الآمنة | إصدار 2026 V5.6</p>
            </div>
        </div>
    </div>

    <!-- المحركات الأساسية -->
    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    
    <script>
        /**
         * ==========================================================================
         * [1] التهيئة التلقائية للوضع الليلي (Auto Dark Mode)
         * ==========================================================================
         */
        (function initTheme() {
            const savedTheme = localStorage.getItem('moakkil_theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();

        /**
         * ==========================================================================
         * [2] دوال الحماية والتعقيم (Security & Sanitization)
         * ==========================================================================
         */
        const escapeHTML = (str) => {
            if (!str && str !== 0) return '';
            return str.toString().replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        };

        /**
         * ==========================================================================
         * [3] محرك إنشاء وتصدير بطاقة جهة الاتصال (vCard Generator V5.6)
         * ==========================================================================
         */
        const downloadVCard = (user) => {
            const firmName = user.mo_firms ? user.mo_firms.firm_name : 'مكتب محاماة معتمد';
            let roleAr = user.role;
            if (user.role === 'admin' || user.role === 'super_admin') roleAr = 'مدير / محامي شريك';
            else if (user.role === 'lawyer') roleAr = 'محامي مزاول';
            else if (user.role === 'secretary') roleAr = 'سكرتاريا وإدارة';

            // بناء ملف vCard 3.0 وفق المعايير العالمية
            const vcardContent = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `FN:${user.full_name || ''}`,
                `ORG:${firmName}`,
                `TITLE:${roleAr}`,
                `TEL;TYPE=WORK,VOICE:${user.phone || ''}`,
                'NOTE:تم التحقق والتصدير رسمياً من منصة موكّل ERP لإدارة مكاتب المحاماة.',
                'END:VCARD'
            ].join('\r\n');

            // إنشاء الرابط وتنزيل الملف
            const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `${(user.full_name || 'lawyer-card').trim().replace(/\s+/g, '_')}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        /**
         * ==========================================================================
         * [4] موجه الطلبات وبدء التحقق عند فتح الصفحة (Router & Boot)
         * ==========================================================================
         */
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            
            const type = params.get('type');
            const id = params.get('id');

            const oldToken = params.get('token');
            const oldInvId = params.get('inv');

            try {
                if (type === 'receipt' && id) {
                    await verifyReceiptData(id);
                } else if (type === 'cv' && id) {
                    await verifyCVData(id);
                } else if (oldToken && oldInvId) {
                    await verifyLegacyReceipt(oldToken, oldInvId);
                } else {
                    showError("رابط التحقق غير مكتمل أو تالف. يرجى مسح رمز الـ QR الأصلي مجدداً من السند المعتمد لتجنب التلاعب.");
                }
            } catch (error) {
                console.error("Verification Error:", error);
                showError("حدث خطأ غير متوقع أثناء الاتصال بالخادم المركزي. يرجى إعادة المحاولة لاحقاً.");
            }
        };

        /**
         * ==========================================================================
         * [5] وحدات معالجة البيانات والتحقق السحابي (Verification Controllers)
         * ==========================================================================
         */
        async function verifyReceiptData(id) {
            if (typeof API === 'undefined' || typeof API.verifyReceipt !== 'function') {
                showError("تعذر تحميل محرك فحص السندات.");
                return;
            }

            const res = await API.verifyReceipt(id);
            if (res && res.success && res.data) {
                showReceiptSuccess(res.data);
            } else {
                showError("لم يتم العثور على هذا السند في سجلات المكتب المعتمدة، أو أنه مسجل كدفعة ملغاة أو غير مسددة.");
            }
        }

        async function verifyCVData(id) {
            if (typeof API === 'undefined' || typeof API.verifyCV !== 'function') {
                showError("تعذر تحميل محرك فحص الهويات المهنية.");
                return;
            }

            const res = await API.verifyCV(id);
            if (res && res.success && res.data) {
                showCVSuccess(res.data);
            } else {
                showError("تعذر العثور على سجل هذا العضو في الهيئات والمكاتب المعتمدة، أو أن حسابه موقوف إدارياً.");
            }
        }

        async function verifyLegacyReceipt(token, invId) {
            if (typeof API === 'undefined' || typeof API.getPublicPortalData !== 'function') {
                showError("تعذر تحميل محرك الفحص القديم.");
                return;
            }

            const res = await API.getPublicPortalData(token);
            if (res && !res.error && res.installments) {
                const invoice = res.installments.find(i => i.id === invId);
                const caseData = res.case || {};
                const firmData = res.firm || {};

                if (invoice && invoice.status === 'مدفوعة') {
                    const assembledData = {
                        ...invoice,
                        currency: firmData.currency || res.currency || 'د.أ',
                        mo_cases: { 
                            case_internal_id: caseData.case_internal_id, 
                            mo_clients: { full_name: res.client?.full_name } 
                        },
                        mo_firms: { firm_name: firmData.firm_name }
                    };
                    showReceiptSuccess(assembledData);
                } else {
                    showError("لم يتم العثور على هذا السند المالي، أو أنه مسجل كدفعة قيد الانتظار ولم يتم تحصيلها.");
                }
            } else {
                showError("تعذر الوصول لسجلات القضية، أو أن رابط الملف العام قد انتهت صلاحيته.");
            }
        }

        /**
         * ==========================================================================
         * [6] عرض نتائج التحقق الإيجابية والسلبية (Views)
         * ==========================================================================
         */
        function showReceiptSuccess(inv) {
            document.getElementById('loading-state').classList.add('d-none');
            document.getElementById('result-state').classList.remove('d-none');

            document.getElementById('header-visual-element').innerHTML = `
                <div id="status-icon-div" class="status-icon status-valid mx-auto">
                    <i class="fas fa-check-circle"></i>
                </div>
            `;

            document.getElementById('status-title').innerText = "سند رسمي أصلي ومعتمد";
            document.getElementById('status-title').className = "fw-bold mb-1";
            document.getElementById('status-title').style.color = "var(--emerald)";
            document.getElementById('status-desc').innerText = "تمت مطابقة التوقيع التشفيري للسند مع السجلات المركزية بنجاح.";

            const firmName = inv.mo_firms ? inv.mo_firms.firm_name : 'مكتب محاماة معتمد';
            const caseNum = inv.mo_cases ? inv.mo_cases.case_internal_id : 'غير محدد';
            const clientName = (inv.mo_cases && inv.mo_cases.mo_clients) ? inv.mo_cases.mo_clients.full_name : 'غير محدد';
            const formattedAmount = Number(inv.amount || 0).toLocaleString();
            const dateStr = inv.due_date || (inv.created_at ? inv.created_at.split('T')[0] : 'غير محدد');
            
            // العملة الديناميكية المعتمدة V5.6
            const currencySymbol = inv.currency || (typeof CONFIG !== 'undefined' && CONFIG.DEFAULT_CURRENCY) || 'د.أ';

            document.getElementById('data-container').innerHTML = `
                <div class="data-row"><span class="label-text">الجهة المصدِرة:</span> <b class="text-navy text-end">${escapeHTML(firmName)}</b></div>
                <div class="data-row"><span class="label-text">رقم ملف القضية:</span> <b class="text-end font-monospace" style="color: var(--royal-gold);">${escapeHTML(caseNum)}</b></div>
                <div class="data-row"><span class="label-text">اسم الموكل:</span> <b class="text-end text-truncate" style="max-width: 170px;" title="${escapeHTML(clientName)}">${escapeHTML(clientName)}</b></div>
                <div class="data-row"><span class="label-text">قيمة السند:</span> <b class="fs-5 text-end font-monospace" style="color: var(--emerald);">${formattedAmount} <small class="fs-6 text-muted">${escapeHTML(currencySymbol)}</small></b></div>
                <div class="data-row"><span class="label-text">تاريخ السداد:</span> <b dir="ltr" class="text-end font-monospace">${escapeHTML(dateStr)}</b></div>
                <div class="data-row"><span class="label-text">حالة السند:</span> <span class="badge px-3 py-1 rounded-pill" style="background: var(--emerald-bg); color: var(--emerald); border: 1px solid rgba(31, 122, 92, 0.25);"><i class="fas fa-check-circle me-1"></i> مقبوض ومسجل نظامياً</span></div>
                <div class="data-row pb-0"><span class="label-text">الرقم المرجعي (UUID):</span> <b style="font-size: 0.68rem; color: #94A3B8; user-select: all;" class="text-end font-monospace">${escapeHTML(inv.id)}</b></div>
            `;
        }

        async function showCVSuccess(user) {
            document.getElementById('loading-state').classList.add('d-none');
            document.getElementById('result-state').classList.remove('d-none');

            let avatarHtml = `
                <div class="vcard-avatar-wrapper">
                    <div class="vcard-avatar mx-auto">${escapeHTML(user.full_name).charAt(0)}</div>
                    <div class="verified-badge-pill" title="حساب موثق"><i class="fas fa-check"></i></div>
                </div>
            `;
            
            if (user.avatar_url) {
                if (!user.avatar_url.startsWith('http')) {
                    const baseUrl = window.API_BASE_URL || (typeof CONFIG !== 'undefined' ? CONFIG.API_URL : '') || '';
                    avatarHtml = `
                        <div class="vcard-avatar-wrapper">
                            <img src="" data-r2-key="${escapeHTML(user.avatar_url)}" class="vcard-avatar mx-auto" alt="Lawyer Avatar" onerror="this.onerror=null; this.outerHTML='<div class=\\'vcard-avatar mx-auto\\'>${escapeHTML(user.full_name).charAt(0)}</div>';">
                            <div class="verified-badge-pill" title="حساب موثق"><i class="fas fa-check"></i></div>
                        </div>
                    `;
                    
                    setTimeout(async () => {
                        const img = document.querySelector('img[data-r2-key]');
                        if (img) {
                            try {
                                const res = await fetch(`${baseUrl}/api/public/r2/download?key=${encodeURIComponent(user.avatar_url)}&client_token=public_bypass`);
                                if (res.ok) {
                                    const blob = await res.blob();
                                    img.src = URL.createObjectURL(blob);
                                    img.removeAttribute('data-r2-key');
                                }
                            } catch(e) { 
                                console.error("Avatar fetch error", e); 
                            }
                        }
                    }, 50);
                } else {
                    avatarHtml = `
                        <div class="vcard-avatar-wrapper">
                            <img src="${escapeHTML(user.avatar_url)}" class="vcard-avatar mx-auto" alt="Lawyer Avatar" onerror="this.onerror=null; this.outerHTML='<div class=\\'vcard-avatar mx-auto\\'>${escapeHTML(user.full_name).charAt(0)}</div>';">
                            <div class="verified-badge-pill" title="حساب موثق"><i class="fas fa-check"></i></div>
                        </div>
                    `;
                }
            }

            document.getElementById('header-visual-element').innerHTML = avatarHtml;

            document.getElementById('status-title').innerText = "هوية مهنية موثقة ومعتمدة";
            document.getElementById('status-title').className = "fw-bold mb-1 text-navy";
            document.getElementById('status-desc').innerText = "تم التحقق من انتماء العضو للكادر القانوني للمكتب المعتمد في السجلات.";

            const firmName = user.mo_firms ? user.mo_firms.firm_name : 'مكتب محاماة معتمد';
            
            let roleAr = user.role;
            if (user.role === 'admin' || user.role === 'super_admin') roleAr = 'مدير / محامي شريك';
            else if (user.role === 'lawyer') roleAr = 'محامي مزاول';
            else if (user.role === 'secretary') roleAr = 'سكرتاريا وإدارة';

            document.getElementById('data-container').innerHTML = `
                <div class="data-row"><span class="label-text">الاسم الكامل:</span> <b class="text-navy text-end">${escapeHTML(user.full_name)}</b></div>
                <div class="data-row"><span class="label-text">الصفة المهنية:</span> <b class="text-end" style="color: var(--royal-gold);">${escapeHTML(roleAr)}</b></div>
                <div class="data-row"><span class="label-text">الكيان التابع له:</span> <b class="text-end text-truncate" style="max-width: 160px;">${escapeHTML(firmName)}</b></div>
                <div class="data-row"><span class="label-text">رقم القيد / النقابة:</span> <b class="text-end font-monospace" dir="ltr" style="color: #38BDF8;">${escapeHTML(user.syndicate_number || 'غير مدخل')}</b></div>
                <div class="data-row"><span class="label-text">هاتف التواصل:</span> <b class="text-end font-monospace" dir="ltr" style="color: var(--emerald);">${escapeHTML(user.phone || 'غير متوفر')}</b></div>
                
                <div class="mt-4 mb-2">
                    <button id="btn-download-vcard" class="btn btn-vcard w-100 rounded-pill fw-bold py-2 shadow-sm d-flex align-items-center justify-content-center gap-2">
                        <i class="fas fa-address-book"></i> حفظ جهة الاتصال في الهاتف (vCard)
                    </button>
                </div>
                
                <div class="data-row pb-0 border-0 mt-2 text-center w-100">
                    <span class="badge px-4 py-2 w-100 rounded-pill fs-6" style="background: var(--emerald-bg); color: var(--emerald); border: 1px solid rgba(31, 122, 92, 0.25);">
                        <i class="fas fa-shield-check me-1"></i> حساب موثق ونشط أمنياً
                    </span>
                </div>
            `;

            // ربط زر تحميل جهة الاتصال
            const vcardBtn = document.getElementById('btn-download-vcard');
            if (vcardBtn) {
                vcardBtn.addEventListener('click', () => downloadVCard(user));
            }
        }

        function showError(msg) {
            document.getElementById('loading-state').classList.add('d-none');
            document.getElementById('result-state').classList.remove('d-none');
            
            const card = document.getElementById('verify-content');
            if (card) card.classList.add('status-invalid-card');

            document.getElementById('header-visual-element').innerHTML = `
                <div id="status-icon-div" class="status-icon status-invalid mx-auto">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
            `;

            document.getElementById('status-title').innerText = "تحذير: سجل غير موثق";
            document.getElementById('status-title').className = "fw-bold mb-1";
            document.getElementById('status-title').style.color = "var(--ruby)";
            document.getElementById('status-desc').innerText = "العملية مرفوضة أمنياً أو غير مسجلة في السحابة المركزية.";
            
            document.getElementById('data-container').innerHTML = `
                <div class="alert mb-0 small text-center fw-bold shadow-sm rounded-4 lh-lg" style="background: var(--ruby-bg); color: var(--ruby); border: 1px solid rgba(179, 55, 47, 0.25);">
                    <i class="fas fa-ban fs-5 d-block mb-2"></i>
                    ${escapeHTML(msg)}
                    <hr class="my-2" style="border-color: rgba(179, 55, 47, 0.3);">
                    <span class="opacity-75" style="font-size: 0.8rem;">في حال كنت تعتقد أن هذا خطأ، يرجى مراجعة إدارة المكتب المصدِر للسند فوراً.</span>
                </div>
            `;
        }
    </script>
</body>
</html>
