name = "curly-pond-9975"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 🛡️ KV Namespaces
[[kv_namespaces]]
binding = "MOAKKIL_KV"
id = "moakkil_kv_production" # استبدل بالـ ID الفعلي من لوحة Cloudflare

# 🛡️ R2 Bucket
[[r2_buckets]]
binding = "MOAKKIL_R2"
bucket_name = "moakkil-files"

# 🛡️ Workers AI
[ai]
binding = "AI"

# 🛡️ المتغيرات العامة (Non-sensitive Environment Variables)
[vars]
ALLOWED_ORIGINS = "https://moakkil.karakibs.com,https://moakkil-app.pages.dev,http://localhost:3000,http://localhost:5500"
VAPID_PUBLIC_KEY = "BEl62vp95h4An3Wp7K8nS8zYvS8zYvS8zYvS8zYvS8zYvS8zYvS8zYvS8zYvS8zYvS8zYvS8zYvS8zYvS8zYv"

