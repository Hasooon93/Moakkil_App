<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- ========================================================
         [1] إعدادات الصفحة والروابط الخارجية (Meta & Links)
         ======================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B132B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>نظام موكّل لإدارة المحاماة V5.6 | بوابة تسجيل الدخول الآمنة</title>
    
    <!-- أيقونات المتصفح وتطبيقات الويب (PWA) -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg4PE-keniz_4Af49kFkt6o_JmNj4K1yDZpdoDpXtzZcw6Zylh6l3MKyG186d2NmFov_1xIZ8qhXY136PeE5OpQlWQgR45YFvKo9MdMlL6K0rE-IqIyiMINdIrAynb44a2V_177s_xcULbLfMWgLuXJP4-uQ8zx3V-Cl3HNwXucegTli7-sDlUnAIGS__M/s320/icon-512.png.png">
    <link rel="apple-touch-icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg4PE-keniz_4Af49kFkt6o_JmNj4K1yDZpdoDpXtzZcw6Zylh6l3MKyG186d2NmFov_1xIZ8qhXY136PeE5OpQlWQgR45YFvKo9MdMlL6K0rE-IqIyiMINdIrAynb44a2V_177s_xcULbLfMWgLuXJP4-uQ8zx3V-Cl3HNwXucegTli7-sDlUnAIGS__M/s320/icon-512.png.png">
    <link rel="manifest" href="./manifest.json">

    <!-- المكتبات الخارجية -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" crossorigin="anonymous">
    <link href="./css/style.css" rel="stylesheet">
    
    <!-- تهيئة الوضع الليلي الفورية -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('moakkil_dark_mode');
                const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = (savedTheme === 'true' || (savedTheme === null && systemPrefersDark));
                if (isDark) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- ========================================================
         [2] التصميم المعماري والأمني (CSS Architecture)
         ======================================================== -->
    <style>
        :root { 
            --primary-navy: #0B132B; 
            --secondary-navy: #1C2541;
            --gold-luxury: #D4AF37;
            --gold-hover: #b5952f;
            --gold-accent: #8A6A12;
            --bg-light: #FAF8F3;
            --emerald: #1F7A5C;
            --ruby: #B3372F;
            --text-dark: #1A1A1A;
            --text-muted: #64748B;
            --telegram: #0088cc;
            --card-glass: rgba(255, 255, 255, 0.97);
            --border-card: rgba(212, 175, 55, 0.35);
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, var(--primary-navy) 0%, var(--secondary-navy) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            color: var(--text-dark);
        }

        /* مؤثرات الخلفية الأمنية العائمة */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb-1 { 
            width: 420px; 
            height: 420px; 
            background: rgba(212, 175, 55, 0.16); 
            top: -90px; 
            right: -90px; 
        }
        .orb-2 { 
            width: 520px; 
            height: 520px; 
            background: rgba(11, 19, 43, 0.95); 
            bottom: -160px; 
            left: -160px; 
            animation-delay: -6s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(45px, 55px) scale(1.06); }
        }

        /* الكارت الزجاجي الفاخر (Glassmorphism) */
        .login-card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 50px 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--border-card);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        /* شارة الأمان الملكية */
        .secure-badge {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-navy);
            color: var(--gold-luxury);
            padding: 6px 22px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 6px 18px rgba(11, 19, 43, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.6);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        /* الشعار الدائري */
        .logo-circle {
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, var(--primary-navy), var(--secondary-navy));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 12px 35px rgba(11, 19, 43, 0.4);
            border: 3px solid var(--gold-luxury);
            position: relative;
        }
        .logo-circle::after {
            content: ''; 
            position: absolute; 
            top: -5px; 
            left: -5px; 
            right: -5px; 
            bottom: -5px;
            border-radius: 50%; 
            border: 1px dashed rgba(212, 175, 55, 0.6); 
            animation: spin 16s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* الحقول */
        .form-control {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 15px 20px;
            font-size: 1.15rem;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--primary-navy);
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .form-control:focus {
            border-color: var(--gold-luxury);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
            background: #ffffff;
            outline: none;
        }

        /* حقل الـ OTP (تصميم الخزنة) */
        .otp-input {
            letter-spacing: 22px;
            font-size: 2.1rem;
            text-align: center;
            font-weight: 900;
            padding: 14px !important;
            color: var(--primary-navy);
            font-family: monospace;
            background: repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(11, 19, 43, 0.05) 38px, rgba(11, 19, 43, 0.05) 40px);
        }

        /* الأزرار الأساسية */
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary-navy), var(--secondary-navy));
            color: #FFFFFF;
            border-radius: 16px;
            padding: 15px;
            font-weight: 900;
            font-size: 1.12rem;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(11, 19, 43, 0.25);
        }

        .btn-primary-custom:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--secondary-navy), var(--primary-navy));
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(11, 19, 43, 0.35);
            border-color: var(--gold-luxury);
            color: var(--gold-luxury);
        }
        
        .btn-primary-custom:disabled {
            background: #94A3B8;
            cursor: not-allowed;
            opacity: 0.9;
            box-shadow: none;
            color: #F1F5F9;
        }

        /* صندوق تعليمات التيليغرام */
        .telegram-box {
            background: rgba(0, 136, 204, 0.05);
            border-radius: 16px;
            border: 1px dashed rgba(0, 136, 204, 0.45);
            padding: 18px 15px;
            margin-bottom: 24px;
            transition: 0.3s ease;
        }
        .telegram-box:hover {
            border-style: solid;
            background: rgba(0, 136, 204, 0.09);
            border-color: var(--telegram);
        }

        .telegram-link {
            color: var(--telegram);
            font-weight: 900;
            text-decoration: none;
            padding: 9px 24px;
            border-radius: 30px;
            background: rgba(0, 136, 204, 0.12);
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            margin-top: 4px;
        }

        .telegram-link:hover {
            background: var(--telegram);
            color: white;
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.35);
            transform: translateY(-2px);
        }

        /* زر البصمة الفاخر */
        .btn-bio {
            background-color: transparent;
            color: var(--primary-navy);
            border: 2px solid var(--primary-navy);
            border-radius: 16px;
            padding: 14px;
            font-weight: 900;
            font-size: 1.08rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-bio:hover {
            background-color: var(--primary-navy);
            color: var(--gold-luxury);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(11, 19, 43, 0.2);
        }

        /* ==========================================================================
           3. الوضع الليلي فائق التباين (WCAG AAA Dark Mode)
           ========================================================================== */
        [data-theme="dark"] {
            --card-glass: rgba(17, 26, 51, 0.96);
            --border-card: rgba(212, 175, 55, 0.45);
            --text-dark: #F8FAFC;
            --text-muted: #94A3B8;
        }
        [data-theme="dark"] .login-card {
            border-top: 1px solid rgba(212, 175, 55, 0.4);
            border-left: 1px solid rgba(212, 175, 55, 0.4);
            color: #F8FAFC;
        }
        [data-theme="dark"] .form-control {
            background: #070C1B;
            border-color: #1E293B;
            color: #F8FAFC;
        }
        [data-theme="dark"] .form-control:focus {
            background: #0B132B;
            border-color: var(--gold-luxury);
            color: #F8FAFC;
        }
        [data-theme="dark"] .otp-input {
            color: #F8FAFC;
            background: repeating-linear-gradient(90deg, transparent, transparent 38px, rgba(212, 175, 55, 0.08) 38px, rgba(212, 175, 55, 0.08) 40px);
        }
        [data-theme="dark"] .btn-bio {
            color: var(--gold-luxury);
            border-color: var(--gold-luxury);
        }
        [data-theme="dark"] .btn-bio:hover {
            background-color: var(--gold-luxury);
            color: #070C1B;
        }
        [data-theme="dark"] .telegram-box {
            background: rgba(0, 136, 204, 0.1);
        }
        [data-theme="dark"] h3, [data-theme="dark"] label {
            color: #F8FAFC !important;
        }

        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(16px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @media (max-width: 480px) {
            .login-card { padding: 38px 22px; border-radius: 20px; }
            .logo-circle { width: 80px; height: 80px; }
            .otp-input { letter-spacing: 14px; font-size: 1.7rem; }
        }
    </style>
</head>
<body>

    <!-- مؤثرات الخلفية الأمنية -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="login-card fade-in">
        
        <!-- شارة التشفير الصارم -->
        <div class="secure-badge">
            <i class="fas fa-lock"></i> 256-BIT ZERO-TRUST ENCRYPTION
        </div>

        <div class="text-center mb-4">
            <div class="logo-circle">
                <i class="fas fa-balance-scale fa-3x" style="color: var(--gold-luxury);"></i>
            </div>
            <h3 class="fw-bold mb-1" style="color: var(--primary-navy);">
                نظام موكّل <span style="color: var(--gold-luxury); font-size: 0.8em;">ERP</span>
            </h3>
            <p class="text-muted small fw-bold">
                <i class="fas fa-shield-check text-success me-1"></i> تسجيل الدخول الموحد والمصادقة الثنائية (2FA)
            </p>
        </div>

        <!-- الخطوة الأولى: إدخال الهاتف المعتمد -->
        <form id="loginForm">
            <div class="mb-4">
                <label for="phoneInput" class="form-label fw-bold text-muted small">رقم الهاتف المسجل بالنظام <span class="text-danger">*</span></label>
                <input type="tel" id="phoneInput" class="form-control" placeholder="07xxxxxxxx أو 05xxxxxxxx" required autocomplete="tel" dir="ltr">
            </div>

            <div class="telegram-box text-center">
                <small class="text-muted fw-bold d-block mb-2" style="font-size: 0.85rem;">لاستلام رمز التحقق الفوري المشفر، تأكد من بدء المحادثة مع البوت:</small>
                <a href="https://t.me/Moakkil_bot" target="_blank" rel="noopener noreferrer" class="telegram-link">
                    <i class="fab fa-telegram fa-lg"></i> @Moakkil_bot
                </a>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 shadow-sm" id="btnRequestOtp">
                <i class="fas fa-paper-plane"></i> إرسال رمز التحقق
            </button>
            
            <!-- زر الدخول البيومتري بالبصمة (يظهر تلقائياً إذا كان الجهاز مسجلاً) -->
            <button type="button" class="btn btn-bio w-100 mt-3 d-none" id="btnBiometric" onclick="handleBiometricLogin()">
                <i class="fas fa-fingerprint me-2 fs-5"></i> الدخول السريع بالبصمة (WebAuthn)
            </button>
        </form>

        <!-- الخطوة الثانية: إدخال رمز التحقق السري (OTP) -->
        <form id="otpForm" class="d-none fade-in">
            <div class="mb-4">
                <label for="otpInput" class="form-label fw-bold text-muted text-center w-100 small">أدخل الرمز السري المرسل لتيليغرام <span class="text-danger">*</span></label>
                <input type="text" id="otpInput" class="form-control otp-input" placeholder="------" maxlength="6" required autocomplete="one-time-code" dir="ltr">
            </div>
            
            <button type="submit" class="btn btn-primary-custom w-100 shadow-sm mb-3" id="btnVerifyOtp">
                <i class="fas fa-shield-alt"></i> تأكيد الدخول وتشفير الجلسة
            </button>
            
            <button type="button" onclick="location.reload()" class="btn btn-link btn-sm w-100 text-decoration-none fw-bold text-muted">
                <i class="fas fa-redo-alt me-1"></i> العودة وتعديل رقم الهاتف
            </button>
        </form>
        
        <!-- روابط التسجيل والروابط القانونية -->
        <div class="text-center mt-4 pt-3 border-top" style="border-color: rgba(212, 175, 55, 0.2) !important;">
            <div class="d-flex justify-content-center align-items-center gap-3 mb-2 small fw-bold">
                <a href="register.html" class="text-warning text-decoration-none" title="تسجيل منشأة جديدة">
                    <i class="fas fa-user-plus me-1"></i> تسجيل مكتب جديد
                </a>
                <span class="text-muted">|</span>
                <a href="index.html" class="text-muted text-decoration-none" title="الرئيسية">
                    <i class="fas fa-home me-1"></i> الرئيسية
                </a>
            </div>
            <div class="d-flex justify-content-center gap-3 small text-muted" style="font-size: 0.75rem;">
                <a href="privacy.html" class="text-muted text-decoration-none">سياسة الخصوصية</a>
                <span>•</span>
                <a href="terms.html" class="text-muted text-decoration-none">شروط الاستخدام</a>
            </div>
        </div>
    </main>

    <!-- المكتبات والسكربتات الأساسية -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" crossorigin="anonymous"></script> 
    
    <!-- محركات النظام الأمنية V5.6 -->
    <script src="./js/config.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/auth.js"></script> 
    
    <script>
        let currentPhone = '';
        const loginForm = document.getElementById('loginForm');
        const otpForm = document.getElementById('otpForm');
        const btnRequestOtp = document.getElementById('btnRequestOtp');
        const btnVerifyOtp = document.getElementById('btnVerifyOtp');

        // توليد معرّف الجهاز الفريد (Device ID)
        function initDeviceId() {
            if (!localStorage.getItem('moakkil_device_id')) {
                localStorage.setItem('moakkil_device_id', 'dev_' + crypto.randomUUID());
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initDeviceId();
            
            try {
                // سحب ألوان وهوية المكتب المعتمدة
                const settings = JSON.parse(localStorage.getItem('firm_settings') || '{}');
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                
                if (settings?.primary_color && !isDark) {
                    document.documentElement.style.setProperty('--primary-navy', settings.primary_color);
                    document.documentElement.style.setProperty('--navy', settings.primary_color);
                }
                if (settings?.accent_color) {
                    document.documentElement.style.setProperty('--gold-luxury', settings.accent_color);
                    document.documentElement.style.setProperty('--accent', settings.accent_color);
                }
            } catch (e) {
                console.error("Theme Loading Error:", e);
            }

            // إظهار زر البصمة إذا كان الجهاز موثقاً مسبقاً
            if (localStorage.getItem('moakkil_biometric_id')) {
                const btnBio = document.getElementById('btnBiometric');
                if (btnBio) btnBio.classList.remove('d-none');
            }
        });

        // ---------------------------------------------------------
        // 1. طلب الرمز السري (Request OTP)
        // ---------------------------------------------------------
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const phoneInput = document.getElementById('phoneInput');
                const phone = phoneInput ? phoneInput.value.trim() : '';
                if (!phone) return;

                btnRequestOtp.disabled = true;
                btnRequestOtp.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> جاري الاتصال الآمن...';

                try {
                    await AUTH.requestOTP(phone);
                    currentPhone = phone;
                    
                    loginForm.classList.add('d-none');
                    otpForm.classList.remove('d-none');
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'تم إرسال الرمز!',
                        text: 'تحقق من حسابك في تطبيق تيليغرام الآن، الرمز صالح لعدة دقائق.',
                        confirmButtonColor: 'var(--primary-navy)',
                        timer: 3500,
                        timerProgressBar: true
                    });
                    
                    setTimeout(() => {
                        const otpIn = document.getElementById('otpInput');
                        if (otpIn) otpIn.focus();
                    }, 350);

                } catch (err) {
                    Swal.fire({ 
                        icon: 'error', 
                        title: 'فشل إرسال الرمز', 
                        text: err.message || 'حدث خطأ في النظام. تأكد من الرقم المسجل وصلاحية حسابك.', 
                        confirmButtonColor: 'var(--primary-navy)' 
                    });
                } finally {
                    btnRequestOtp.disabled = false;
                    btnRequestOtp.innerHTML = '<i class="fas fa-paper-plane me-2"></i> إرسال رمز التحقق';
                }
            });
        }

        // ---------------------------------------------------------
        // 2. التحقق من الرمز (Verify OTP)
        // ---------------------------------------------------------
        if (otpForm) {
            otpForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const otpInput = document.getElementById('otpInput');
                const otp = otpInput ? otpInput.value.trim() : '';
                if (!otp) return;

                btnVerifyOtp.disabled = true;
                btnVerifyOtp.innerHTML = '<i class="fas fa-shield-alt fa-fade me-2"></i> جاري التحقق وتشفير الجلسة...';

                try {
                    await AUTH.verifyOTP(currentPhone, otp);
                    Swal.fire({
                        icon: 'success',
                        title: 'تمت المصادقة بنجاح',
                        text: 'جاري تشفير الجلسة والتوجيه إلى لوحة التحكم...',
                        showConfirmButton: false,
                        timer: 1500
                    });
                } catch (err) {
                    Swal.fire({ 
                        icon: 'error', 
                        title: 'رفض الوصول', 
                        text: err.message || 'رمز التحقق غير صحيح أو انتهت صلاحيته.', 
                        confirmButtonColor: 'var(--primary-navy)' 
                    });
                    btnVerifyOtp.disabled = false;
                    btnVerifyOtp.innerHTML = '<i class="fas fa-shield-alt me-2"></i> تأكيد الدخول وتشفير الجلسة';
                    if (otpInput) {
                        otpInput.value = '';
                        otpInput.focus();
                    }
                }
            });
        }

        // ---------------------------------------------------------
        // 3. الدخول بالبصمة البيومترية (Biometric WebAuthn Login)
        // ---------------------------------------------------------
        async function handleBiometricLogin() {
            const btnBio = document.getElementById('btnBiometric');
            if (!btnBio) return;
            const originalContent = btnBio.innerHTML;
            
            btnBio.disabled = true;
            btnBio.innerHTML = '<i class="fas fa-fingerprint fa-fade me-2 fs-5"></i> جاري فحص البصمة...';
            
            try {
                await AUTH.loginWithBiometric();
            } catch (err) {
                Swal.fire({ 
                    icon: 'error', 
                    title: 'فشل مطابقة البصمة', 
                    text: err.message || 'تعذر تسجيل الدخول بالبصمة. يرجى استخدام رقم الهاتف ورمز التحقق.', 
                    confirmButtonColor: 'var(--primary-navy)' 
                });
            } finally {
                btnBio.disabled = false;
                btnBio.innerHTML = originalContent;
            }
        }

        // تسجيل Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
